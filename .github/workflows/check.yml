# The same checks as before a push, for every push and pull request: types, lint, build and the size budget (tools/perf-budget.json).
name: check
on:
  push:
    branches: [main, optimize]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npm run build
      - run: node tools/perf-budget.mjs
